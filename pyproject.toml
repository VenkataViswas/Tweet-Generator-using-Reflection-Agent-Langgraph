[project]
name = "reflection-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "venkataviswas", email = "tumbalivenkataviswas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
reflection-agent = "reflection_agent.main:main"

[build-system]
